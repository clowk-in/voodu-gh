name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: shellcheck -e SC1090,SC1091 scripts/*.sh

  action:
    name: Action metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: action.yml parses
        run: python3 -c "import yaml,sys; yaml.safe_load(open('action.yml'))"
